name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Версии «слоёв». Смена любой версии = новый ключ кэша = чистая установка этого слоя.
  CARGO_NDK_VERSION: "4.1.2"
  NDK_VERSION: "26.3.11579264"
  ANDROID_API: "34"
  BUILD_TOOLS: "34.0.0"
  GRADLE_VERSION: "8.9"
  JAVA_VERSION: "17"
  # Если нужно принудительно сбросить все слои — поменяйте это число.
  CACHE_SALT: "v1"
  # Путь SDK на образах GitHub (нужен в контексте env для ключей кэша).
  ANDROID_HOME: /usr/local/lib/android/sdk
  TOOLS_DIR: /home/runner/.tyt-tools

jobs:
  core-tests:
    name: Rust core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo test --manifest-path core/Cargo.toml

  apk:
    name: Android APK
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: core-tests
    steps:
      - uses: actions/checkout@v6

      # ───────────── Слой JDK ─────────────
      # restore → проверка → (если слоя нет или он битый) установка с нуля → сохранение
      - name: "Layer JDK: restore"
        id: jdk-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.TOOLS_DIR }}/jdk
          key: jdk-${{ runner.os }}-temurin${{ env.JAVA_VERSION }}-${{ env.CACHE_SALT }}

      - name: "Layer JDK: verify"
        id: jdk-verify
        run: |
          if "$TOOLS_DIR/jdk/bin/java" -version 2>&1 | grep -q "version \"$JAVA_VERSION\."; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ steps.jdk-cache.outputs.cache-hit }}" = "true" ]; then
              echo "::warning::JDK cache was restored but is broken — installing from scratch"
            fi
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Layer JDK: install from scratch"
        if: steps.jdk-verify.outputs.ok != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: "Layer JDK: activate"
        id: jdk
        run: |
          if [ "${{ steps.jdk-verify.outputs.ok }}" = "true" ]; then
            state="restored from cache, verified"
          else
            rm -rf "$TOOLS_DIR/jdk"
            mkdir -p "$TOOLS_DIR"
            cp -a "$JAVA_HOME" "$TOOLS_DIR/jdk"
            state="installed from scratch"
          fi
          "$TOOLS_DIR/jdk/bin/java" -version 2>&1 | grep -q "version \"$JAVA_VERSION\." \
            || { echo "::error::JDK layer is invalid after install"; exit 1; }
          echo "JAVA_HOME=$TOOLS_DIR/jdk" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/jdk/bin" >> "$GITHUB_PATH"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: "Layer JDK: save"
        if: steps.jdk.outputs.state == 'installed from scratch'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.TOOLS_DIR }}/jdk
          key: jdk-${{ runner.os }}-temurin${{ env.JAVA_VERSION }}-${{ env.CACHE_SALT }}

      # ───────────── Слой Go: компилятор ─────────────
      - name: Read Go version from xraycore/go.mod
        id: gover
        run: echo "v=$(awk '/^go /{print $2; exit}' xraycore/go.mod)" >> "$GITHUB_OUTPUT"

      - name: "Layer Go toolchain: restore"
        id: go-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.TOOLS_DIR }}/go
          key: go-toolchain-${{ runner.os }}-${{ steps.gover.outputs.v }}-${{ env.CACHE_SALT }}

      - name: "Layer Go toolchain: verify"
        id: go-verify
        run: |
          if "$TOOLS_DIR/go/bin/go" version 2>&1 | grep -q "go${{ steps.gover.outputs.v }}"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ steps.go-cache.outputs.cache-hit }}" = "true" ]; then
              echo "::warning::Go toolchain cache was restored but is broken — installing from scratch"
            fi
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Layer Go toolchain: install from scratch"
        if: steps.go-verify.outputs.ok != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.gover.outputs.v }}
          cache: false

      - name: "Layer Go toolchain: activate"
        id: go-tool
        run: |
          if [ "${{ steps.go-verify.outputs.ok }}" = "true" ]; then
            state="restored from cache, verified"
          else
            rm -rf "$TOOLS_DIR/go"
            mkdir -p "$TOOLS_DIR"
            cp -a "$(go env GOROOT)" "$TOOLS_DIR/go"
            state="installed from scratch"
          fi
          "$TOOLS_DIR/go/bin/go" version | grep -q "go${{ steps.gover.outputs.v }}" \
            || { echo "::error::Go toolchain layer is invalid after install"; exit 1; }
          echo "GOROOT=$TOOLS_DIR/go" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/go/bin" >> "$GITHUB_PATH"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: "Layer Go toolchain: save"
        if: steps.go-tool.outputs.state == 'installed from scratch'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.TOOLS_DIR }}/go
          key: go-toolchain-${{ runner.os }}-${{ steps.gover.outputs.v }}-${{ env.CACHE_SALT }}

      # ───────────── Слой Go: модули Xray-core ─────────────
      - name: "Layer Go modules: restore"
        id: gomod-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.TOOLS_DIR }}/gomod
          key: go-mod-${{ runner.os }}-${{ steps.gover.outputs.v }}-${{ hashFiles('xraycore/go.sum') }}-${{ env.CACHE_SALT }}

      - name: "Layer Go modules: verify or download"
        id: gomod
        working-directory: xraycore
        run: |
          export GOMODCACHE="$TOOLS_DIR/gomod"
          if go mod verify > /dev/null 2>&1; then
            state="restored from cache, verified"
          else
            if [ "${{ steps.gomod-cache.outputs.cache-hit }}" = "true" ]; then
              echo "::warning::Go modules cache was restored but is broken — downloading from scratch"
            fi
            chmod -R u+w "$GOMODCACHE" 2>/dev/null || true
            rm -rf "$GOMODCACHE"
            go mod download
            state="installed from scratch"
          fi
          go mod verify    # слой обязан быть целым, иначе падаем здесь
          echo "GOMODCACHE=$GOMODCACHE" >> "$GITHUB_ENV"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: "Layer Go modules: save"
        if: steps.gomod.outputs.state == 'installed from scratch'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.TOOLS_DIR }}/gomod
          key: go-mod-${{ runner.os }}-${{ steps.gover.outputs.v }}-${{ hashFiles('xraycore/go.sum') }}-${{ env.CACHE_SALT }}

      # Сборочный кэш Go: содержимое адресуется по хэшам, повреждённые записи Go пересобирает сам.
      - name: "Go build cache"
        uses: actions/cache@v5
        with:
          path: ${{ env.TOOLS_DIR }}/gobuild
          key: go-build-${{ runner.os }}-${{ steps.gover.outputs.v }}-${{ hashFiles('xraycore/**/*.go') }}-${{ env.CACHE_SALT }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ steps.gover.outputs.v }}-

      - name: Point Go build cache to the layer
        run: echo "GOCACHE=$TOOLS_DIR/gobuild" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android

      # ───────────── Слой 1: cargo-ndk ─────────────
      # restore → проверка → (если слоя нет или он битый) установка с нуля → сохранение
      - name: "Layer cargo-ndk: restore"
        id: ndk-tool-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.TOOLS_DIR }}/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-${{ env.CARGO_NDK_VERSION }}-${{ env.CACHE_SALT }}

      - name: "Layer cargo-ndk: verify or install"
        id: ndk-tool
        run: |
          export PATH="$TOOLS_DIR/cargo-ndk/bin:$PATH"
          state=""
          if cargo ndk --version 2>/dev/null | grep -qF "$CARGO_NDK_VERSION"; then
            state="restored from cache, verified"
          else
            if [ "${{ steps.ndk-tool-cache.outputs.cache-hit }}" = "true" ]; then
              echo "::warning::cargo-ndk cache was restored but is broken — reinstalling from scratch"
            fi
            rm -rf "$TOOLS_DIR/cargo-ndk"
            cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked --root "$TOOLS_DIR/cargo-ndk"
            state="installed from scratch"
          fi
          cargo ndk --version | grep -qF "$CARGO_NDK_VERSION"   # слой обязан работать, иначе падаем здесь
          echo "$TOOLS_DIR/cargo-ndk/bin" >> "$GITHUB_PATH"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: "Layer cargo-ndk: save"
        if: steps.ndk-tool.outputs.state == 'installed from scratch'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.TOOLS_DIR }}/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-${{ env.CARGO_NDK_VERSION }}-${{ env.CACHE_SALT }}

      # ───────────── Слой 2: Android SDK (NDK + платформа + build-tools) ─────────────
      - name: "Layer Android SDK: restore"
        id: sdk-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_HOME }}/platforms/android-${{ env.ANDROID_API }}
            ${{ env.ANDROID_HOME }}/build-tools/${{ env.BUILD_TOOLS }}
          key: android-sdk-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-api${{ env.ANDROID_API }}-bt${{ env.BUILD_TOOLS }}-${{ env.CACHE_SALT }}

      - name: "Layer Android SDK: verify or install"
        id: sdk
        run: |
          sdk_ok() {
            [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ] &&
            [ -f "$ANDROID_HOME/platforms/android-$ANDROID_API/android.jar" ] &&
            [ -x "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2" ]
          }
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          # Лицензии не входят в кэш пакетов, принимаем всегда (быстро).
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          if sdk_ok; then
            state="restored from cache, verified"
          else
            if [ "${{ steps.sdk-cache.outputs.cache-hit }}" = "true" ]; then
              echo "::warning::Android SDK cache was restored but is incomplete — installing from scratch"
            fi
            "$SDKMANAGER" --install "ndk;$NDK_VERSION" "platforms;android-$ANDROID_API" "build-tools;$BUILD_TOOLS"
            state="installed from scratch"
          fi
          sdk_ok || { echo "::error::Android SDK layer is invalid after install"; exit 1; }
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: "Layer Android SDK: save"
        if: steps.sdk.outputs.state == 'installed from scratch'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_HOME }}/platforms/android-${{ env.ANDROID_API }}
            ${{ env.ANDROID_HOME }}/build-tools/${{ env.BUILD_TOOLS }}
          key: android-sdk-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-api${{ env.ANDROID_API }}-bt${{ env.BUILD_TOOLS }}-${{ env.CACHE_SALT }}

      # ───────────── Слой 3: Gradle (дистрибутив, зависимости, кэш сборки) ─────────────
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Show cache layers
        run: |
          {
            echo "### Слои кэша"
            echo "| Слой | Состояние |"
            echo "|---|---|"
            echo "| cargo-ndk ${CARGO_NDK_VERSION} | ${{ steps.ndk-tool.outputs.state }} |"
            echo "| Android SDK (NDK ${NDK_VERSION}, API ${ANDROID_API}, build-tools ${BUILD_TOOLS}) | ${{ steps.sdk.outputs.state }} |"
            echo "| JDK ${JAVA_VERSION} | ${{ steps.jdk.outputs.state }} |"
            echo "| Go ${{ steps.gover.outputs.v }} (компилятор) | ${{ steps.go-tool.outputs.state }} |"
            echo "| Go-модули Xray-core | ${{ steps.gomod.outputs.state }} |"
            echo "| Gradle / Rust target / Go build | см. отчёты setup-gradle, rust-cache и actions/cache |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK (Rust + Kotlin)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v6
        with:
          name: TytBrowser-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
