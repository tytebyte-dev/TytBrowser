[package]
name = "tytcore"
version = "0.1.0"
edition = "2021"
description = "Нативное ядро TytBrowser: омнибокс, блокировщик рекламы/трекеров, режим чтения, подсказки"
license = "MIT"
publish = false

[lib]
name = "tytcore"
crate-type = ["cdylib", "rlib"]

[features]
default = ["xray"]
# Встроенный прокси (xray-rs). Без него ядро собирается без сетевых зависимостей.
xray = ["dep:xray-rs", "dep:tokio", "dep:tracing-subscriber", "dep:tracing"]

[dependencies]
jni = "0.21"
xray-rs = { path = "third_party/xray-rs", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"], optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
